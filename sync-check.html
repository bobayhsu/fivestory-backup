<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五大類故事｜同步診斷</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:720px;margin:25px auto;padding:15px;color:#222}li{padding:8px;border-bottom:1px solid #ddd}button{font-size:20px;padding:12px 18px;border-radius:8px} .error{color:#c32121}.ok{color:#16834b}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>五大類故事｜同步診斷</h1><p>本頁只檢查連線，不修改投影片或資料庫資料。</p><ol id="status"><li>正在檢查…</li></ol><button id="signIn" hidden>使用 Google 登入</button><p id="result"></p><script>
const list=document.getElementById('status'),btn=document.getElementById('signIn'),result=document.getElementById('result');list.innerHTML='';function report(message,ok){const n=document.createElement('li');n.textContent=message;n.className=ok?'ok':'error';list.append(n)}function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('無法載入：'+src));document.head.append(s)})}
(async()=>{report('目前網址：'+location.href,true);try{await load('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');await load('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js');await load('https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js');report('Firebase SDK 載入成功',true)}catch(e){report(e.message,false);return}try{await load('./sync-config.js?v=diagnose1');if(!window.FIVESTORY_FIREBASE_CONFIG)throw Error('找不到 FIVESTORY_FIREBASE_CONFIG');report('sync-config.js 載入成功',true)}catch(e){report(e.message,false);return}try{firebase.initializeApp(window.FIVESTORY_FIREBASE_CONFIG);report('Firebase 初始化成功',true)}catch(e){report(e.message,false);return}const auth=firebase.auth();btn.hidden=false;btn.onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){report('登入失敗：'+e.code,false)}};auth.onAuthStateChanged(async user=>{if(!user){report('尚未登入：請點 Google 登入',false);return}btn.hidden=true;report('登入成功：'+(user.email||'Google 帳號'),true);report('UID：'+user.uid,true);const ref=firebase.database().ref('rooms/class1/screen');ref.once('value').then(()=>{report('Realtime Database 讀取成功；有權進入 class1',true);result.textContent='基礎連線成功。若主網頁仍未顯示同步提示，問題在新版 index.html 的載入或同步啟動流程。'}).catch(e=>report('資料庫讀取失敗：'+e.code+' '+e.message,false))})})()
</script></body></html>
